services:
  genesis_ros:
    build: .
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - vol-ros2-build:/workspace/build
      - vol-ros2-install:/workspace/install
      - vol-ros2-log:/workspace/log
      - ./src:/workspace/src/src
      - ./libs/genesis_ros:/workspace/src/genesis_ros
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/dri:/dev/dri
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [compute, utility, graphics, display, video]

volumes:
  vol-ros2-build:
  vol-ros2-install:
  vol-ros2-log:
